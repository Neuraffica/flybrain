[project]
name = "fly-pursuit"
version = "0.0.1"
description = "flybrain demo: a fly pursuit circuit turns a simulated robot dog toward a target"
requires-python = ">=3.11"
dependencies = [
    "flybrain-demo-api",
    "flybrain-models",
    "numpy",
]

[project.scripts]
fly-pursuit = "fly_pursuit.cli:main"

# This line makes the demo appear in Flydeck (after `uv sync`).
[project.entry-points."flybrain.demos"]
fly-pursuit = "fly_pursuit.flydeck:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_pursuit"]

[tool.uv.sources]
flybrain-demo-api = { workspace = true }
flybrain-models = { workspace = true }
