[project]
name = "fly-compass"
version = "0.0.1"
description = "flybrain demo: a fly head-direction circuit keeps a Bittle's head pointing one way"
requires-python = ">=3.11"
dependencies = [
    "flybrain-demo-api",
    "flybrain-edge",
    "flybrain-models",
    "numpy",
]

[project.scripts]
fly-compass = "fly_compass.cli:main"

[project.entry-points."flybrain.demos"]
fly-compass = "fly_compass.flydeck:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_compass"]

[tool.uv.sources]
flybrain-demo-api = { workspace = true }
flybrain-edge = { workspace = true }
flybrain-models = { workspace = true }
