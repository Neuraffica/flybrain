[project]
name = "fly-escape"
version = "0.0.1"
description = "flybrain demo: a fly looming-escape circuit makes a Bittle jump back from an approaching hand"
requires-python = ">=3.11"
dependencies = [
    "flybrain-demo-api",
    "flybrain-edge",
    "flybrain-models",
    "fly-compass",
    "numpy",
]

[project.scripts]
fly-escape = "fly_escape.cli:main"

[project.entry-points."flybrain.demos"]
fly-escape = "fly_escape.flydeck:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_escape"]

[tool.uv.sources]
flybrain-demo-api = { workspace = true }
flybrain-edge = { workspace = true }
flybrain-models = { workspace = true }
fly-compass = { workspace = true }
