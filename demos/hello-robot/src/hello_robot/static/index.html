<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello robot</title>
<link rel="stylesheet" href="/assets/living-signal.css">
<link rel="icon" href="/assets/neuraffica.svg">
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.6 var(--font-body); }
header { border-bottom: 1px solid var(--outline-variant); background: var(--paper); }
.head { max-width: 680px; margin: 0 auto; padding: 20px 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.head img { width: 28px; height: 28px; flex: none; margin-top: 2px; }
h1 { font-family: var(--font-headline); font-weight: 600; font-size: 1.6rem; line-height: 1.15; margin: 4px 0 2px; letter-spacing: -0.01em; }
main { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
.muted { color: var(--ink-muted); }
.tray { background: var(--surface-low); border-radius: var(--r-lg); padding: 14px; }
.card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--r-md); padding: 18px; }
.label { font: 600 11px/1.3 var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 12px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 0; align-items: baseline; }
dt { font: 600 10px/1.3 var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
dd { margin: 0; font: 500 14px/1.4 var(--font-label); font-variant-numeric: tabular-nums; color: var(--ink); }
button { font: 600 11px/1 var(--font-label); letter-spacing: .12em; text-transform: uppercase; min-height: 36px;
  padding: 0 18px; border-radius: var(--r-full); border: 1px solid var(--primary); cursor: pointer; margin-top: 18px;
  background: linear-gradient(45deg, var(--primary-strong), var(--primary)); color: var(--on-primary); }
button:hover { background: var(--primary-strong); }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.warn:not(:empty) { margin-top: 14px; padding: 10px 12px; border-left: 4px solid var(--amber); background: var(--surface-low);
  border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header><div class="head">
  <img src="/assets/neuraffica.svg" alt="" aria-hidden="true">
  <div>
    <div class="ls-eyebrow">Flydeck demo</div>
    <h1>Hello robot</h1>
    <div class="muted" id="phase">waiting for the robot...</div>
  </div>
</div></header>
<main>
  <div class="tray">
  <div class="card">
    <div class="label">The robot</div>
    <dl>
      <dt>Robot</dt><dd id="model">-</dd>
      <dt>Firmware</dt><dd id="version">-</dd>
      <dt>Link</dt><dd id="link">-</dd>
      <dt>Battery</dt><dd id="voltage">-</dd>
      <dt>Yaw / pitch / roll</dt><dd id="imu">-</dd>
      <dt>Head wags</dt><dd id="wags">0</dd>
    </dl>
    <div class="warn" id="low"></div>
    <button id="wag">Wag again</button>
  </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
new EventSource("/api/stream").onmessage = (e) => {
  const f = JSON.parse(e.data);
  $("phase").textContent = f.phase;
  $("model").textContent = f.model || "?";
  $("version").textContent = f.version || "?";
  $("link").textContent = f.link;
  $("voltage").textContent = f.voltage == null ? "unknown" : f.voltage.toFixed(2) + " V";
  $("imu").textContent = f.yaw == null ? "-" : `${f.yaw}° / ${f.pitch}° / ${f.roll}°`;
  $("wags").textContent = f.wags;
  $("low").textContent = f.low_power ? "Robot says: " + f.low_power : "";
};
$("wag").onclick = () => fetch("/api/command", { method: "POST", body: '{"action":"wag"}' });
</script>
</body>
</html>
