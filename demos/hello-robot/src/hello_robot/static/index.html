<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello robot</title>
<style>
:root { --paper:#f6f2ea; --card:#fffdf8; --ink:#1f1b16; --muted:#6b6257; --line:#e2d9ca;
  --accent:#b8402a; --warn:#9a6a00; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --paper:#15130f; --card:#1d1a15; --ink:#ece6da;
  --muted:#a0968a; --line:#322d25; --accent:#e8735a; --warn:#e0b050; } }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 var(--sans); }
main { max-width:640px; margin:0 auto; padding:24px 16px; }
h1 { font-family:var(--serif); font-weight:600; margin:0 0 4px; }
.muted { color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;
  margin-top:16px; }
dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0; }
dt { color:var(--muted); } dd { margin:0; font-variant-numeric:tabular-nums; }
button { font:inherit; padding:8px 16px; border-radius:8px; border:0; background:var(--accent);
  color:#fff; cursor:pointer; margin-top:16px; }
.warn { color:var(--warn); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Hello robot</h1>
  <div class="muted" id="phase">waiting for the robot...</div>
  <div class="card">
    <dl>
      <dt>Robot</dt><dd id="model">-</dd>
      <dt>Firmware</dt><dd id="version">-</dd>
      <dt>Link</dt><dd id="link">-</dd>
      <dt>Battery</dt><dd id="voltage">-</dd>
      <dt>Yaw / pitch / roll</dt><dd id="imu">-</dd>
      <dt>Head wags</dt><dd id="wags">0</dd>
    </dl>
    <div class="warn" id="low"></div>
    <button id="wag">Wag again</button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
new EventSource("/api/stream").onmessage = (e) => {
  const f = JSON.parse(e.data);
  $("phase").textContent = f.phase;
  $("model").textContent = f.model || "?";
  $("version").textContent = f.version || "?";
  $("link").textContent = f.link;
  $("voltage").textContent = f.voltage == null ? "unknown" : f.voltage.toFixed(2) + " V";
  $("imu").textContent = f.yaw == null ? "-" : `${f.yaw}° / ${f.pitch}° / ${f.roll}°`;
  $("wags").textContent = f.wags;
  $("low").textContent = f.low_power ? "Robot says: " + f.low_power : "";
};
$("wag").onclick = () => fetch("/api/command", { method: "POST", body: '{"action":"wag"}' });
</script>
</body>
</html>
