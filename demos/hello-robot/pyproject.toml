[project]
name = "hello-robot"
version = "0.0.1"
description = "flybrain demo template: connect, say hello, wag the head, rest"
requires-python = ">=3.11"
dependencies = [
    "flybrain-demo-api",
    "flybrain-edge",
]

[project.scripts]
hello-robot = "hello_robot.cli:main"

# This line makes the demo appear in Flydeck (after `uv sync`).
[project.entry-points."flybrain.demos"]
hello-robot = "hello_robot.flydeck:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_robot"]

[tool.uv.sources]
flybrain-demo-api = { workspace = true }
flybrain-edge = { workspace = true }
