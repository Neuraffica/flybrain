[project]
name = "flybrain-edge"
version = "0.0.1"
description = "flybrain starter kit: edge"
requires-python = ">=3.11"
dependencies = [
    "bleak>=3.1.0",
    "flybrain-models",
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain_edge"]

[project.scripts]
flybrain-bittle = "flybrain_edge.bittle.probe:main"
flybrain-export = "flybrain_edge.export.cli:main"

[tool.uv.sources]
flybrain-models = { workspace = true }
