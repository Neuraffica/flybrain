[project]
name = "flybrain-demo-api"
version = "0.1.0"
description = "flybrain: the small, dependency-free API a demo uses to appear in Flydeck"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain_demo_api"]
