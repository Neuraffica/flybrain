[project]
name = "flybrain-data"
version = "0.0.1"
description = "flybrain starter kit: data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
flybrain-data = "flybrain_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain_data"]
