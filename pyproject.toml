[project]
name = "flybrain"
version = "0.0.1"
description = "Starter kit for Fly Brain & Tiny Machines, a BioCompute hackathon by Neuraffica"
requires-python = ">=3.11"
dependencies = ["flybrain-data", "flybrain-models", "flybrain-edge"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
flybrain-data = { workspace = true }
flybrain-models = { workspace = true }
flybrain-edge = { workspace = true }

[tool.ruff]
line-length = 100
