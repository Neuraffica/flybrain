[project]
name = "flybrain"
version = "0.0.1"
description = "Starter kit for Fly Brain & Tiny Machines, a BioCompute hackathon by Neuraffica"
requires-python = ">=3.11"
dependencies = ["flybrain-data", "flybrain-models", "flybrain-edge", "fly-compass"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "demos/fly-compass"]

[tool.uv.sources]
flybrain-data = { workspace = true }
flybrain-models = { workspace = true }
flybrain-edge = { workspace = true }
fly-compass = { workspace = true }

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
