<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flydeck</title>
<style>
:root {
  --paper: #f6f2ea; --card: #fffdf8; --ink: #1f1b16; --muted: #6b6257; --line: #e2d9ca;
  --accent: #b8402a; --accent-ink: #fff; --accent-soft: #f3ddd4; --ok: #2f6f4f; --ok-soft: #dcebe2;
  --warn: #8a5d00; --warn-soft: #f6e8c6; --bad: #a3271b; --bad-soft: #f6d9d4; --code: #efe8db;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15130f; --card: #1d1a15; --ink: #ece6da; --muted: #a0968a; --line: #322d25;
    --accent: #e8735a; --accent-ink: #1b0f0b; --accent-soft: #3a211b; --ok: #7fc8a0;
    --ok-soft: #1c3027; --warn: #e0b050; --warn-soft: #362a12; --bad: #f08b7a; --bad-soft: #3c1d18;
    --code: #26221b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15130f; --card: #1d1a15; --ink: #ece6da; --muted: #a0968a; --line: #322d25;
  --accent: #e8735a; --accent-ink: #1b0f0b; --accent-soft: #3a211b; --ok: #7fc8a0;
  --ok-soft: #1c3027; --warn: #e0b050; --warn-soft: #362a12; --bad: #f08b7a; --bad-soft: #3c1d18;
  --code: #26221b; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 22px 0 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0; }
h1 { font-size: 2.2rem; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.12rem; }
.tag { color: var(--muted); margin-top: 2px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; margin-top: 20px;
  align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .layout.has-run > main { order: -1; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel + .panel { margin-top: 16px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-bottom: 10px; }
.kicker { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
button, .btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
button:hover:not(:disabled), .btn:hover { border-color: var(--muted); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.danger { background: var(--bad); border-color: var(--bad); color: var(--card); }
button.small, .btn.small { padding: 4px 10px; min-height: 30px; font-size: 0.86rem; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible,
.demo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.banner { border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: 0.92rem; }
.banner.info { background: var(--accent-soft); }
.banner.warn { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.banner.bad { background: var(--bad-soft); border-left: 4px solid var(--bad); }
.banner.ok { background: var(--ok-soft); border-left: 4px solid var(--ok); }
.robot-current { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--paper); }
.robot-name { font-weight: 700; font-size: 1.05rem; word-break: break-all; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0;
  font-size: 0.9rem; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .who { min-width: 0; }
.list .who b { display: block; word-break: break-all; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 6px;
  vertical-align: -1px; }
.bars i { width: 3px; background: var(--line); border-radius: 1px; }
.bars i.on { background: var(--ok); }
.sub { margin-top: 16px; }
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.demo { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  background: var(--card); cursor: pointer; display: flex; flex-direction: column; gap: 8px;
  min-height: 150px; font-weight: 400; align-items: stretch; }
.demo:hover { border-color: var(--muted); }
.demo.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.demo.broken { border-style: dashed; cursor: default; }
.demo p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--code);
  color: var(--ink); }
.chip.moves { background: var(--warn-soft); }
.chip.sim { background: var(--ok-soft); }
.err { color: var(--bad); font-size: 0.88rem; word-break: break-word; }
.setup { margin-top: 16px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px;
  margin-top: 12px; }
.field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
.field .help { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
.field.check label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
select, input[type=number], input[type=text] { font: inherit; width: 100%; padding: 7px 9px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.startbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 16px;
  padding-top: 14px; border-top: 1px solid var(--line); }
.startbar label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.space { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; }
.cmd { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); margin-top: 10px;
  word-break: break-all; }
.run-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
  flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.8rem;
  padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.running { background: var(--ok-soft); color: var(--ok); }
.pill.starting, .pill.connecting, .pill.calibrating, .pill.stopping { background: var(--warn-soft); color: var(--warn); }
.pill.attention, .pill.failed { background: var(--bad-soft); color: var(--bad); }
.pill.stopped { background: var(--code); color: var(--muted); }
.pill.running::before, .pill.starting::before, .pill.connecting::before,
.pill.calibrating::before, .pill.stopping::before { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .pill::before { animation: none !important; } }
.frame-wrap { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: var(--paper); }
.frame-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
iframe { display: block; width: 100%; height: min(72vh, 820px); border: 0; background: var(--paper); }
details.log { margin-top: 12px; }
details.log summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
pre.log { background: var(--code); border-radius: 8px; padding: 10px; font: 12px/1.45 var(--mono);
  max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; }
.empty { color: var(--muted); font-size: 0.9rem; padding: 6px 0; }
.gone { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 92%, transparent);
  display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; z-index: 5; }
.gone.show { display: flex; }
[hidden] { display: none !important; }
.source { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: -2px 0 12px;
  font-size: 0.9rem; }
.source .path { font-family: var(--mono); font-size: 0.82rem; word-break: break-all; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Flydeck</h1>
      <div class="tag" id="tagline">Pick a robot, pick a fly-brain demo, press Start.</div>
    </div>
    <div class="top-actions">
      <a class="btn small" href="/guide" target="_blank" rel="noopener">Guide</a>
      <button class="small" id="quit" title="Stops any running demo (the robot rests), then closes Flydeck">Quit Flydeck</button>
    </div>
  </header>
  <div id="banners" aria-live="polite"></div>

  <div class="layout" id="layout">
    <aside>
      <section class="panel" aria-labelledby="robot-h">
        <div class="section-title"><h2 id="robot-h">Robot</h2><span class="kicker" id="held"></span></div>
        <div class="robot-current" id="current"></div>
        <div class="sub">
          <div class="section-title">
            <span class="kicker">Bluetooth</span>
            <button class="small" id="scan">Scan</button>
          </div>
          <div id="ble"></div>
        </div>
        <div class="sub">
          <div class="section-title">
            <span class="kicker">USB cable</span>
            <button class="small" id="ports">Refresh</button>
          </div>
          <div id="usb"></div>
        </div>
      </section>
    </aside>

    <main>
      <section class="panel" id="run-panel" hidden aria-labelledby="run-h"></section>
      <section class="panel" aria-labelledby="deck-h">
        <div class="section-title"><h2 id="deck-h">Demos</h2>
          <button class="small" id="reload" title="Look for new demos (after uv sync)">Reload list</button></div>
        <div id="source" hidden></div>
        <div class="deck" id="deck"></div>
        <div class="setup" id="setup"></div>
      </section>
    </main>
  </div>
</div>
<div class="gone" id="gone"><div><h2>Flydeck has stopped</h2><p class="muted" id="gone-hint">You can close this tab.</p></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let S = null;            // latest hub state
let selected = null;     // demo id shown in the setup panel
let formFor = null;      // demo id the form was built for
let simulator = false;
let lastError = null;    // refusal shown under Start
let frameUrl = null;
let previewTimer = null;
let preview = null;

async function post(action, body = {}) {
  try {
    const r = await fetch("/api/" + action, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    return await r.json();
  } catch (e) {
    return { ok: false, error: "Flydeck is not answering (" + e.message + ")" };
  }
}

function ago(t) {
  if (!t) return "";
  const s = Math.round(Date.now() / 1000 - t);
  return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : new Date(t * 1000).toLocaleTimeString();
}
function bars(rssi) {
  const n = rssi == null ? 0 : rssi > -60 ? 4 : rssi > -70 ? 3 : rssi > -80 ? 2 : 1;
  return `<span class="bars" aria-hidden="true">${[1, 2, 3, 4].map((i) => `<i class="${i <= n ? "on" : ""}" style="height:${3 + i * 2}px"></i>`).join("")}</span>`;
}

// ---- banners --------------------------------------------------------------------------
function renderBanners() {
  const out = [];
  if (S.app.ble_hint) out.push(`<div class="banner warn">${esc(S.app.ble_hint)}</div>`);
  $("banners").innerHTML = out.join("");
}

// ---- robot panel ----------------------------------------------------------------------
function renderRobot() {
  const R = S.robot, sel = R.selected, chk = R.check;
  $("held").textContent = R.held_by ? "connected by: " + R.held_by : "";
  let h = "";
  if (!sel) {
    h = `<div class="muted">No robot chosen yet. Scan for it over Bluetooth, or plug in the USB cable.</div>`;
  } else {
    h = `<div class="kicker">${sel.transport === "ble" ? "Bluetooth" : "USB"}</div>
      <div class="robot-name">${esc(sel.name)}</div>`;
    if (chk && chk.ok) {
      h += `<dl class="facts"><dt>Model</dt><dd>${esc(chk.model || "?")}</dd>
        <dt>Firmware</dt><dd>${esc(chk.version || "?")}</dd>
        <dt>Battery</dt><dd>${chk.voltage == null ? "not reported" : esc(chk.voltage.toFixed(2)) + " V"}</dd>
        <dt>Checked</dt><dd>${ago(chk.at)}</dd></dl>`;
      if (chk.warning) h += `<div class="banner bad">${esc(chk.warning)}</div>`;
    } else if (chk && !chk.ok) {
      h += `<div class="banner bad">${esc(chk.error)}</div>`;
    }
    h += `<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button class="small" id="check" ${R.checking || R.held_by ? "disabled" : ""}>${R.checking ? "Checking…" : "Check"}</button>
      <span class="muted small">${R.held_by ? "busy while a demo runs" : "connects briefly, then lets go"}</span></div>`;
  }
  $("current").innerHTML = h;
  const ck = $("check"); if (ck) ck.onclick = () => post("check");

  const scan = R.scan;
  $("scan").disabled = R.scanning || !!R.held_by;
  $("scan").textContent = R.scanning ? "Scanning…" : "Scan";
  let b = "";
  if (R.scanning) b = `<div class="empty">Looking for robots for 5 seconds…</div>`;
  else if (!scan) b = `<div class="empty">Switch the robot on, then press Scan.</div>`;
  else if (!scan.ok) b = `<div class="banner bad">${esc(scan.error)}</div>`;
  else if (!scan.devices.length) b = `<div class="banner warn">${esc(scan.hint || "No robot found.")}</div>`;
  else b = `<ul class="list">${scan.devices.map((d) => {
      const isSel = sel && sel.transport === "ble" && sel.target === d.name;
      return `<li><span class="who"><b>${esc(d.name)}</b><span class="muted small">${bars(d.rssi)}${d.rssi ?? "?"} dBm</span></span>
        <button class="small use" data-t="ble" data-v="${esc(d.name)}" ${isSel ? "disabled" : ""}>${isSel ? "Chosen" : "Use"}</button></li>`;
    }).join("")}</ul><div class="muted small" style="margin-top:6px">Scanned ${ago(scan.at)}.</div>`;
  $("ble").innerHTML = b;

  const ports = R.ports || [];
  $("usb").innerHTML = ports.length
    ? `<ul class="list">${ports.map((p) => {
        const isSel = sel && sel.transport === "usb" && sel.target === p;
        return `<li><span class="who"><b>${esc(p.replace("/dev/", ""))}</b></span>
          <button class="small use" data-t="usb" data-v="${esc(p)}" ${isSel ? "disabled" : ""}>${isSel ? "Chosen" : "Use"}</button></li>`;
      }).join("")}</ul>`
    : `<div class="empty">No robot cable found. Plug it in and press Refresh.</div>`;
  document.querySelectorAll("button.use").forEach((btn) => {
    btn.onclick = async () => {
      const r = await post("select", { transport: btn.dataset.t, target: btn.dataset.v, name: btn.dataset.v });
      if (r.ok) post("check");
    };
  });
}

// ---- demo deck ------------------------------------------------------------------------
function demoById(id) { return S.demos.find((d) => d.id === id); }

function renderDeck() {
  const run = S.run && S.run.active ? S.run : null;
  $("deck").innerHTML = S.demos.map((d) => {
    if (!d.ok) {
      return `<div class="demo broken"><h3>${esc(d.title)}</h3><div class="err">${esc(d.error)}</div>
        <div class="muted small">${esc(d.source)}</div></div>`;
    }
    const chips = [
      ...d.needs.map((n) => `<span class="chip">${esc(n)}</span>`),
      d.moves_robot ? `<span class="chip moves">moves the robot</span>` : `<span class="chip">does not move</span>`,
      d.supports_mock ? `<span class="chip sim">simulator</span>` : "",
      run && run.demo_id === d.id ? `<span class="chip sim">running</span>` : "",
    ].join("");
    return `<button class="demo ${d.id === selected ? "selected" : ""}" data-id="${esc(d.id)}" aria-pressed="${d.id === selected}">
      <h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p><div class="chips">${chips}</div></button>`;
  }).join("") || `<div class="empty">No demos found. Run uv sync in the flybrain folder, then Reload list.</div>`;
  document.querySelectorAll(".demo[data-id]").forEach((el) => {
    el.onclick = () => { selected = el.dataset.id; lastError = null; renderDeck(); renderSetup(); };
  });
}

function fieldHtml(o, value) {
  const id = "opt-" + o.name;
  const help = o.help ? `<div class="help">${esc(o.help)}</div>` : "";
  if (o.type === "bool") {
    return `<div class="field check"><label><input type="checkbox" id="${id}" data-opt="${esc(o.name)}" ${value ? "checked" : ""}> ${esc(o.label)}</label>${help}</div>`;
  }
  if (o.type === "choice") {
    return `<div class="field"><label for="${id}">${esc(o.label)}</label><select id="${id}" data-opt="${esc(o.name)}">
      ${o.choices.map((c) => `<option ${String(c) === String(value) ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>${help}</div>`;
  }
  const num = o.type === "int" || o.type === "float";
  const attrs = num ? `type="number" step="${o.type === "int" ? 1 : "any"}" ${o.min != null ? `min="${o.min}"` : ""} ${o.max != null ? `max="${o.max}"` : ""}` : `type="text"`;
  return `<div class="field"><label for="${id}">${esc(o.label)}</label><input ${attrs} id="${id}" data-opt="${esc(o.name)}" value="${esc(value)}">${help}</div>`;
}

function formValues() {
  const v = {};
  document.querySelectorAll("[data-opt]").forEach((el) => {
    v[el.dataset.opt] = el.type === "checkbox" ? el.checked : el.value;
  });
  return v;
}

function renderSetup() {
  const d = selected && demoById(selected);
  if (!d || !d.ok) { $("setup").innerHTML = ""; formFor = null; return; }
  const keep = formFor === d.id ? formValues() : null;
  const vals = keep || { ...Object.fromEntries(d.options.map((o) => [o.name, o.default])), ...(d.saved || {}) };
  if (!d.supports_mock) simulator = false;
  const opts = d.options.filter((o) => simulator || !o.mock_only);
  $("setup").innerHTML = `
    <div class="panel" style="background:var(--paper)">
      <div class="section-title"><h3>${esc(d.title)}</h3>
        ${d.has_guide ? `<a class="small" href="/demos/${encodeURIComponent(d.id)}/guide" target="_blank" rel="noopener">How it works →</a>` : ""}</div>
      ${opts.length ? `<div class="form">${opts.map((o) => fieldHtml(o, vals[o.name])).join("")}</div>` : `<div class="muted">No settings.</div>`}
      <div class="startbar">
        ${d.supports_mock ? `<label><input type="checkbox" id="sim" ${simulator ? "checked" : ""}> Try in simulator (no robot)</label>` : ""}
        <label class="space" id="space-wrap" hidden><input type="checkbox" id="space"> The robot has space to move</label>
        <button class="primary" id="start">Start</button>
      </div>
      <div id="start-msg"></div>
      <div class="cmd" id="cmd"></div>
    </div>`;
  formFor = d.id;
  const sim = $("sim");
  if (sim) sim.onchange = () => { simulator = sim.checked; lastError = null; renderSetup(); };
  document.querySelectorAll("[data-opt]").forEach((el) => { el.onchange = schedulePreview; el.oninput = schedulePreview; });
  $("start").onclick = start;
  updateStartState();
  schedulePreview();
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    if (!formFor) return;
    preview = await post("preview", { demo: formFor, options: formValues(), simulator });
    const wrap = $("space-wrap"); if (!wrap) return;
    wrap.hidden = !(preview.ok && preview.needs_space);
    $("cmd").textContent = preview.ok ? preview.command : "";
    if (!preview.ok) showStartMsg(preview.error, "bad");
  }, 120);
}

function showStartMsg(text, kind) {
  const m = $("start-msg"); if (!m) return;
  m.innerHTML = text ? `<div class="banner ${kind}">${esc(text)}</div>` : "";
}

function updateStartState() {
  const btn = $("start"); if (!btn) return;
  const run = S.run && S.run.active ? S.run : null;
  btn.disabled = !!run;
  btn.title = run ? "Stop the running demo first: one demo at a time" : "";
  if (lastError) showStartMsg(lastError, "bad");
  else if (run) showStartMsg(`${run.title} is running. Stop it before starting another demo.`, "info");
  else if (!simulator && !S.robot.selected) showStartMsg("No robot chosen yet: pick one on the left, or tick 'Try in simulator'.", "warn");
  else showStartMsg("", "");
}

async function start() {
  const space = $("space");
  const r = await post("start", { demo: formFor, options: formValues(), simulator, space: !!(space && space.checked) });
  if (space) space.checked = false; // every start asks again
  lastError = r.ok ? null : r.error;
  updateStartState();
  if (r.ok) window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---- running demo -------------------------------------------------------------------
const STATE_TEXT = {
  starting: "Starting", connecting: "Connecting", calibrating: "Calibrating", running: "Running",
  attention: "Needs attention", stopping: "Stopping", stopped: "Stopped", failed: "Failed",
};
function renderRun() {
  const r = S.run, panel = $("run-panel");
  $("layout").classList.toggle("has-run", !!(r && r.active));
  if (!r) { panel.hidden = true; frameUrl = null; return; }
  panel.hidden = false;
  const link = r.transport === "mock" ? "simulator" : (r.transport === "ble" ? "Bluetooth " : "USB ") + (r.robot || "");
  let head = `<div class="run-head"><div><div class="kicker">${r.active ? "Now running" : "Last run"}</div>
      <h2>${esc(r.title)}</h2><div class="muted small">${esc(link)}</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="pill ${esc(r.state)}">${esc(STATE_TEXT[r.state] || r.state)}</span>
      ${r.active ? `<button class="danger" id="stop" ${r.state === "stopping" ? "disabled" : ""}>${r.state === "stopping" ? "Stopping…" : "Stop"}</button>` : ""}</div></div>`;
  if (r.detail) head += `<div class="muted" style="margin-top:6px">${esc(r.detail)}</div>`;
  for (const w of r.warnings || []) head += `<div class="banner warn">${esc(w)}</div>`;
  if (!r.active && r.reason) head += `<div class="banner ${r.state === "failed" ? "bad" : "ok"}">${esc(r.reason)}</div>`;
  // keep the iframe element alive across updates so the dashboard does not reload
  const showFrame = r.active && r.url;
  if (!panel.querySelector("#run-top")) {
    panel.innerHTML = `<div id="run-top"></div><div id="frame-slot"></div>
      <details class="log" id="logbox"><summary>Output</summary><pre class="log" id="log"></pre></details>`;
  }
  $("run-top").innerHTML = head;
  const st = $("stop"); if (st) st.onclick = () => post("stop");
  if (showFrame && frameUrl !== r.url) {
    frameUrl = r.url;
    $("frame-slot").innerHTML = `<div class="frame-wrap" id="frame-wrap"><div class="frame-bar"><span class="muted">Dashboard</span>
      <a href="${esc(r.url)}" target="_blank" rel="noopener">${APP ? "Open in its own window ↗" : "Open in a new tab ↗"}</a></div>
      <iframe title="${esc(r.title)} dashboard" src="${esc(r.url)}"></iframe></div>`;
  } else if (!showFrame) {
    frameUrl = null;
    $("frame-slot").innerHTML = r.active
      ? `<div class="empty" style="margin-top:12px">The dashboard appears here when the demo is ready.</div>`
      : "";
  }
  const log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = (r.log || []).join("\n");
  if (stick) log.scrollTop = log.scrollHeight;
  if (!r.active && r.state === "failed") $("logbox").open = true;
}

function render() {
  if (!S) return;
  renderBanners();
  renderRobot();
  renderDeck();
  if (formFor !== selected) renderSetup();
  updateStartState();
  renderRun();
}

// ---- wiring -----------------------------------------------------------------------
$("scan").onclick = () => post("scan");
$("ports").onclick = () => post("ports");
$("reload").onclick = async () => { const r = await post("reload"); if (!r.ok) alert(r.error); };
$("quit").onclick = async () => {
  const running = S && S.run && S.run.active;
  if (running && !confirm("Stop " + S.run.title + " (the robot rests) and quit Flydeck?")) return;
  if (APP) APP.quit(); else post("quit");
};

// ---- inside the Flydeck window (pywebview) ---------------------------------------------
// Links: web pages open in the default browser; guides and dashboards in another Flydeck
// window. Where the demos come from: the built-in ones, or a flybrain folder of yours.
let APP = null, SOURCE = null, sourceMsg = null;
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a || !APP) return;
  const u = new URL(a.getAttribute("href"), location.href);
  if (u.protocol !== "http:" && u.protocol !== "https:") return;
  const local = u.hostname === "127.0.0.1" || u.hostname === "localhost";
  if (!local) { e.preventDefault(); APP.open_external(u.href); }
  else if (a.target === "_blank") { e.preventDefault(); APP.open_window(u.href, a.textContent.trim()); }
}, true);

function renderSource() {
  const box = $("source");
  if (!SOURCE || !SOURCE.switchable) { box.hidden = true; return; }
  box.hidden = false;
  const mine = SOURCE.kind === "folder";
  let h = `<div class="source"><span class="muted">Demos from:</span>
    ${mine ? `<span class="path" title="${esc(SOURCE.root)}">${esc(SOURCE.root)}</span>` : `<b>built into Flydeck</b>`}
    <button class="small" id="pick">${mine ? "Change folder…" : "Use my flybrain folder…"}</button>
    ${mine ? `<button class="small" id="builtin">Use the built-in demos</button>` : ""}</div>`;
  const msg = sourceMsg || SOURCE.note;
  if (msg) h += `<div class="banner warn" style="margin:-4px 0 12px">${esc(msg)}</div>`;
  box.innerHTML = h;
  $("pick").onclick = async () => {
    const r = await APP.choose_folder();
    sourceMsg = r.ok || r.cancelled ? null : r.error;
    renderSource();
  };
  const b = $("builtin");
  if (b) b.onclick = async () => { const r = await APP.use_builtin(); sourceMsg = r.ok || r.cancelled ? null : r.error; renderSource(); };
}

window.addEventListener("pywebviewready", async () => {
  APP = window.pywebview.api;
  $("gone-hint").textContent = "Flydeck is closing.";
  try { SOURCE = await APP.source(); } catch (e) { SOURCE = null; }
  renderSource();
  frameUrl = null; // redraw the dashboard link for the window
  if (S) renderRun();
});

function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    if (selected === null && S.demos.length) {
      const run = S.run && S.run.active ? S.run.demo_id : null;
      selected = run || (S.demos.find((d) => d.ok) || {}).id || null;
    }
    render();
  };
  es.addEventListener("bye", () => { es.close(); $("gone").classList.add("show"); });
}
connect();
</script>
</body>
</html>
