<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flydeck</title>
<link rel="stylesheet" href="/assets/living-signal.css">
<link rel="icon" href="/assets/flydeck.svg">
<style>
/* Living Signal tokens, fonts and the marks come from /assets/living-signal.css (shared with
   the dashboards and the guides). Components follow DESIGN.md "Flydeck components". */
* { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; }
a { color: var(--primary); text-underline-offset: 3px; }
a:hover { color: var(--primary-strong); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--ink-muted); }
.small { font-size: 0.84rem; }
.mono { font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-muted); }
h1, h2, h3 { font-family: var(--font-headline); font-weight: 600; line-height: 1.15; margin: 0;
  letter-spacing: -0.01em; color: var(--ink); }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.3rem; }

/* ---- top bar: the Neuraffica identity, then the app's own actions --------------------- */
.topbar { position: sticky; top: 0; z-index: 4; background: var(--paper);
  border-bottom: 1px solid var(--outline-variant); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.topbar .spacer { flex: 1; }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* ---- title, on graph paper as on the web page's cover --------------------------------- */
.hero { position: relative; }
.hero .ls-grid { position: absolute; inset: 0; pointer-events: none; }
.hero .wrap { position: relative; display: flex; align-items: flex-end; justify-content: space-between;
  gap: 8px 24px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 22px; }
.hero h1 { font-size: 2.9rem; line-height: 1.02; margin-top: 10px; letter-spacing: -0.02em; }
.hero h1 em { font-style: italic; font-weight: 500; color: var(--primary); }
.tag { font-size: 1.02rem; color: var(--ink-muted); margin-top: 8px; max-width: 34em; }

/* ---- buttons: pills with mono-caps labels ------------------------------------------- */
button, .btn { font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; border-radius: var(--r-full); padding: 0 16px; min-height: 36px;
  cursor: pointer; border: 1px solid var(--outline); background: var(--surface); color: var(--ink);
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; transition: border-color .15s, color .15s; }
button:hover:not(:disabled), .btn:hover { border-color: var(--primary); color: var(--primary); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: linear-gradient(45deg, var(--primary-strong), var(--primary));
  border-color: var(--primary-strong); color: var(--on-primary); padding: 0 24px; min-height: 42px;
  letter-spacing: 0.16em; }
button.primary:hover:not(:disabled) { color: var(--on-primary); border-color: var(--ink); }
button.danger { background: var(--coral); border-color: var(--coral); color: var(--paper); }
button.danger:hover:not(:disabled) { color: var(--paper); border-color: var(--ink); }
button.small, .btn.small { padding: 0 12px; min-height: 30px; font-size: 10px; }
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
.demo:focus-visible, summary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---- banners: a surface note with an edge; the words carry the meaning ------------------ */
.banner { background: var(--surface); border: 1px solid var(--outline-variant);
  border-left: 4px solid var(--outline); border-radius: var(--r-md); padding: 10px 14px;
  margin-top: 12px; font-size: 0.92rem; color: var(--ink); }
.banner.info { border-left-color: var(--primary); }
.banner.warn { border-left-color: var(--amber-fill); }
.banner.bad { border-left-color: var(--coral); }
.banner.ok { border-left-color: var(--signal); }
#banners .banner:first-child { margin-top: 0; }
#banners:not(:empty) { margin-bottom: 18px; }

/* ---- layout ------------------------------------------------------------------------- */
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start;
  padding-bottom: 64px; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .layout.has-run > main { order: -1; } }
@media (min-width: 1280px) { .layout { grid-template-columns: 360px minmax(0, 1fr); } }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 12px;
  flex-wrap: wrap; margin-bottom: 14px; }
.section-head .ls-eyebrow { display: block; margin-bottom: 6px; }
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
#run-panel:not([hidden]) { margin-bottom: 28px; }

/* ---- robot: the monitor-console tray holding the robot's card --------------------------- */
.tray { background: var(--surface-low); border: 1px solid var(--outline-variant); border-radius: var(--r-lg);
  padding: 14px; }
.card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--r-md);
  padding: 16px; }
.status { display: flex; align-items: center; gap: 8px; font-family: var(--font-label); font-size: 10px;
  font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); }
.status .glyph { font-size: 12px; letter-spacing: 0; color: var(--primary); }
.status .glyph.off { color: var(--ink-muted); }
.robot-name { font-family: var(--font-label); font-weight: 600; font-size: 1.05rem; margin-top: 8px;
  word-break: break-all; color: var(--ink); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 0; align-items: baseline; }
dl.facts dt { font-family: var(--font-label); font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-muted); }
dl.facts dd { margin: 0; font-family: var(--font-label); font-size: 0.86rem; word-break: break-word; }
.robot-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.links { margin-top: 18px; padding: 0 4px; }
.links + .links { margin-top: 16px; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface);
  border: 1px solid var(--outline-variant); border-radius: var(--r-md); }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 12px; border-top: 1px solid var(--outline-variant); }
.list li:first-child { border-top: 0; }
.list .who { min-width: 0; }
.list .who b { display: block; word-break: break-all; font-family: var(--font-label); font-weight: 600;
  font-size: 0.86rem; }
.list .who .muted { font-family: var(--font-label); font-size: 0.76rem; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 6px; vertical-align: -1px; }
.bars i { width: 3px; background: var(--outline); border-radius: 1px; }
.bars i.on { background: var(--primary); }
.empty { color: var(--ink-muted); font-size: 0.88rem; padding: 4px 0; }
.empty-box { color: var(--ink-muted); font-size: 0.88rem; padding: 12px 14px;
  border: 1px dashed var(--outline); border-radius: var(--r-md); }
.note-line { font-size: 0.8rem; color: var(--ink-muted); margin-top: 6px; }

/* ---- where the demos come from --------------------------------------------------------- */
.source { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 0 0 14px;
  padding: 8px 8px 8px 14px; background: var(--surface-low); border: 1px solid var(--outline-variant);
  border-radius: var(--r-full); }
.source .what { font-size: 0.9rem; min-width: 0; flex: 1 1 200px; }
.source .path { font-family: var(--font-label); font-size: 0.8rem; word-break: break-all; }
.source + .banner { margin: -4px 0 14px; }

/* ---- demo cards (the web page's tabs, as a grid that fits a window) ----------------------- */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(192px, 1fr)); gap: 12px; }
.demo { text-align: left; border: 1px solid var(--outline-variant); border-radius: var(--r-lg);
  padding: 16px 16px 14px; background: var(--surface); cursor: pointer; display: flex;
  flex-direction: column; justify-content: flex-start; gap: 8px; min-height: 178px; align-items: stretch; color: var(--ink);
  font: inherit; letter-spacing: normal; text-transform: none; white-space: normal;
  transition: border-color .15s, background-color .15s; }
.demo:hover:not(.selected) { border-color: var(--outline); color: var(--ink); }
.demo.selected { background: var(--surface-low); border-color: var(--primary); }
.demo.selected:hover { color: var(--ink); }
.demo.broken { border-style: dashed; cursor: default; }
.demo h3 { font-size: 1.2rem; }
.demo p { margin: 0; color: var(--ink-muted); font-size: 0.88rem; line-height: 1.5; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.t { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-label); font-size: 9.5px;
  font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px;
  border-radius: var(--r-full); border: 1px solid var(--outline); color: var(--ink-muted); }
.t.sim { border-color: var(--primary); color: var(--primary); }
.t.moves { border-color: var(--amber-fill); color: var(--amber); }
.t.still { border-style: dashed; }
.t.live { background: var(--signal-container); border-color: var(--signal); color: var(--ink); }
.t.live::before { content: "\25CF"; color: var(--signal); font-size: 9px; }
.needs { font-size: 0.8rem; color: var(--ink-muted); line-height: 1.45; }
.needs b { font-family: var(--font-label); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; }
.pick { margin-top: auto; padding-top: 4px; font-family: var(--font-label); font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); }
.demo.selected .pick { color: var(--primary); }
.err { color: var(--coral); font-size: 0.86rem; word-break: break-word; }

/* ---- the chosen demo's panel: a tray with a primary edge, then the start box ------------- */
.setup { margin-top: 14px; }
.setup .tray { border-color: var(--primary); padding: 20px; }
.setup-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.setup-head h3 { font-size: 1.5rem; }
.setup-head .label { display: block; margin-bottom: 6px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; margin-top: 16px; }
.field label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; }
.field .help { color: var(--ink-muted); font-size: 0.8rem; margin-top: 5px; line-height: 1.45; }
.field.check label { display: flex; gap: 8px; align-items: center; }
select, input[type=number], input[type=text] { font: inherit; font-size: 0.92rem; width: 100%; padding: 8px 12px;
  min-height: 38px; border-radius: var(--r-md); border: 1px solid var(--outline); background: var(--surface);
  color: var(--ink); }
input[type=number] { font-family: var(--font-label); }
select:hover, input[type=number]:hover, input[type=text]:hover { border-color: var(--ink-muted); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; flex: none; }
.start-box { margin-top: 18px; background: var(--surface); border: 1px solid var(--outline-variant);
  border-left: 4px solid var(--primary); border-radius: var(--r-md); padding: 14px 16px; }
.startbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.startbar label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; }
.startbar .go { margin-left: auto; }
.space { border: 1px solid var(--amber-fill); border-radius: var(--r-full); padding: 6px 14px; }
.cmd { font-family: var(--font-label); font-size: 0.74rem; color: var(--ink-muted); margin-top: 12px;
  word-break: break-all; }
.cmd:not(:empty)::before { content: "$ "; }

/* ---- the running demo: the brain banner, then its dashboard ------------------------------ */
#run-panel { background: var(--surface-low); border: 1px solid var(--outline-variant); border-radius: var(--r-lg);
  padding: 18px; }
#run-panel.live { border-color: var(--primary); }
.run-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.run-head h2 { margin-top: 6px; }
.run-head .via { font-family: var(--font-label); font-size: 0.8rem; color: var(--ink-muted); margin-top: 4px; }
.run-actions { display: flex; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-label); font-weight: 600;
  font-size: 10px; letter-spacing: 0.16em; padding: 0 12px; min-height: 30px; border-radius: var(--r-full);
  text-transform: uppercase; border: 1px solid var(--outline); background: var(--surface); color: var(--ink-muted); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.running { background: var(--signal-container); border-color: var(--signal); color: var(--ink); }
.pill.running::before { background: var(--signal); animation: glow 2.2s infinite; }
.pill.starting, .pill.connecting, .pill.calibrating, .pill.stopping { border-color: var(--amber-fill); color: var(--amber); }
.pill.starting::before, .pill.connecting::before, .pill.calibrating::before, .pill.stopping::before {
  animation: blink 1.2s infinite; }
.pill.attention, .pill.failed { border-color: var(--coral); color: var(--coral); }
.pill.stopped::before { background: transparent; border: 1.5px solid currentColor; }
@keyframes blink { 50% { opacity: 0.3; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal-glow) 60%, transparent); }
  70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.detail { margin-top: 8px; color: var(--ink-muted); font-size: 0.92rem; }
.frame-wrap { margin-top: 14px; border: 1px solid var(--outline-variant); border-radius: var(--r-md);
  overflow: hidden; background: var(--paper); box-shadow: var(--card-shadow); }
.frame-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 14px; border-bottom: 1px solid var(--outline-variant); background: var(--surface); }
.frame-bar a { font-family: var(--font-label); font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; text-decoration: none; }
.frame-bar a:hover { text-decoration: underline; }
iframe { display: block; width: 100%; height: min(72vh, 820px); border: 0; background: var(--paper); }
.waiting { margin-top: 14px; }
details.log { margin-top: 14px; }
details.log summary { cursor: pointer; font-family: var(--font-label); font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); padding: 4px 0; }
details.log summary:hover { color: var(--primary); }
pre.log { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--r-sm);
  padding: 10px 12px; font: 12px/1.5 var(--font-label); color: var(--ink); max-height: 260px; overflow: auto;
  white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; }

/* ---- Flydeck has stopped ------------------------------------------------------------ */
.gone { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center;
  justify-content: center; text-align: center; padding: 16px; z-index: 10; }
.gone.show { display: flex; }
.gone > div { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--r-lg);
  padding: 28px 36px; box-shadow: var(--card-shadow); max-width: 420px; }
.gone h2 { margin-top: 8px; }
.gone p { margin: 8px 0 0; }

@media (max-width: 640px) { .wrap { padding: 0 16px; } .hero h1 { font-size: 2.3rem; } .ls-chip.app { display: none; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <span class="ls-brand"><img src="/assets/neuraffica.svg" alt="" aria-hidden="true">
      <span class="ls-wordmark"><span class="neura">NEURA</span><span class="ffica">FFICA</span></span></span>
    <span class="ls-chip app">Flydeck</span>
    <span class="spacer"></span>
    <div class="top-actions">
      <a class="btn small" href="/guide" target="_blank" rel="noopener">Guide</a>
      <button class="small" id="quit" title="Stops any running demo (the robot rests), then closes Flydeck">Quit Flydeck</button>
    </div>
  </div>
</div>

<header class="hero">
  <div class="ls-grid" aria-hidden="true"></div>
  <div class="wrap">
    <div>
      <div class="ls-eyebrow">Fly Brain &amp; Tiny Machines · starter kit</div>
      <h1>Flydeck</h1>
      <div class="tag" id="tagline">Pick a robot, pick a fly-brain demo, press Start.</div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="banners" aria-live="polite"></div>

  <div class="layout" id="layout">
    <aside>
      <section aria-labelledby="robot-h">
        <div class="section-head"><div><span class="ls-eyebrow">Pick a robot</span><h2 id="robot-h">Robot</h2></div>
          <span class="label" id="held"></span></div>
        <div class="tray">
          <div class="card" id="current"></div>
          <div class="links">
            <div class="sub-head">
              <span class="label">Bluetooth</span>
              <button class="small" id="scan">Scan</button>
            </div>
            <div id="ble"></div>
          </div>
          <div class="links">
            <div class="sub-head">
              <span class="label">USB cable</span>
              <button class="small" id="ports">Refresh</button>
            </div>
            <div id="usb"></div>
          </div>
        </div>
      </section>
    </aside>

    <main>
      <section id="run-panel" hidden aria-labelledby="run-h"></section>
      <section aria-labelledby="deck-h">
        <div class="section-head"><div><span class="ls-eyebrow">Pick a demo</span><h2 id="deck-h">Demos</h2></div>
          <button class="small" id="reload" title="Look for new demos (after uv sync)">Reload list</button></div>
        <div id="source" hidden></div>
        <div class="deck" id="deck"></div>
        <div class="setup" id="setup"></div>
      </section>
    </main>
  </div>
</div>
<div class="gone" id="gone"><div><span class="ls-eyebrow">Flydeck</span><h2>Flydeck has stopped</h2><p class="muted" id="gone-hint">You can close this tab.</p></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let S = null;            // latest hub state
let selected = null;     // demo id shown in the setup panel
let formFor = null;      // demo id the form was built for
let simulator = false;
let lastError = null;    // refusal shown under Start
let frameUrl = null;
let previewTimer = null;
let preview = null;

async function post(action, body = {}) {
  try {
    const r = await fetch("/api/" + action, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    return await r.json();
  } catch (e) {
    return { ok: false, error: "Flydeck is not answering (" + e.message + ")" };
  }
}

function ago(t) {
  if (!t) return "";
  const s = Math.round(Date.now() / 1000 - t);
  return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : new Date(t * 1000).toLocaleTimeString();
}
function bars(rssi) {
  const n = rssi == null ? 0 : rssi > -60 ? 4 : rssi > -70 ? 3 : rssi > -80 ? 2 : 1;
  return `<span class="bars" aria-hidden="true">${[1, 2, 3, 4].map((i) => `<i class="${i <= n ? "on" : ""}" style="height:${3 + i * 2}px"></i>`).join("")}</span>`;
}

// ---- banners --------------------------------------------------------------------------
function renderBanners() {
  const out = [];
  if (S.app.ble_hint) out.push(`<div class="banner warn">${esc(S.app.ble_hint)}</div>`);
  $("banners").innerHTML = out.join("");
}

// ---- robot panel ----------------------------------------------------------------------
function renderRobot() {
  const R = S.robot, sel = R.selected, chk = R.check;
  $("held").textContent = R.held_by ? "connected by: " + R.held_by : "";
  let h = "";
  if (!sel) {
    h = `<div class="status"><span class="glyph off" aria-hidden="true">○</span>No robot chosen</div>
      <div class="muted small" style="margin-top:8px">No robot chosen yet. Scan for it over Bluetooth, or plug in the USB cable.</div>`;
  } else {
    const ok = chk && chk.ok;
    h = `<div class="status"><span class="glyph ${ok ? "" : "off"}" aria-hidden="true">${ok ? "●" : "○"}</span>${sel.transport === "ble" ? "Bluetooth" : "USB"}</div>
      <div class="robot-name">${esc(sel.name)}</div>`;
    if (chk && chk.ok) {
      h += `<dl class="facts"><dt>Model</dt><dd>${esc(chk.model || "?")}</dd>
        <dt>Firmware</dt><dd>${esc(chk.version || "?")}</dd>
        <dt>Battery</dt><dd>${chk.voltage == null ? "not reported" : esc(chk.voltage.toFixed(2)) + " V"}</dd>
        <dt>Checked</dt><dd>${ago(chk.at)}</dd></dl>`;
      if (chk.warning) h += `<div class="banner bad">${esc(chk.warning)}</div>`;
    } else if (chk && !chk.ok) {
      h += `<div class="banner bad">${esc(chk.error)}</div>`;
    }
    h += `<div class="robot-actions">
      <button class="small" id="check" ${R.checking || R.held_by ? "disabled" : ""}>${R.checking ? "Checking…" : "Check"}</button>
      <span class="muted small">${R.held_by ? "busy while a demo runs" : "connects briefly, then lets go"}</span></div>`;
  }
  $("current").innerHTML = h;
  const ck = $("check"); if (ck) ck.onclick = () => post("check");

  const scan = R.scan;
  $("scan").disabled = R.scanning || !!R.held_by;
  $("scan").textContent = R.scanning ? "Scanning…" : "Scan";
  let b = "";
  if (R.scanning) b = `<div class="empty-box">Looking for robots for 5 seconds…</div>`;
  else if (!scan) b = `<div class="empty-box">Switch the robot on, then press Scan.</div>`;
  else if (!scan.ok) b = `<div class="banner bad">${esc(scan.error)}</div>`;
  else if (!scan.devices.length) b = `<div class="banner warn">${esc(scan.hint || "No robot found.")}</div>`;
  else b = `<ul class="list">${scan.devices.map((d) => {
      const isSel = sel && sel.transport === "ble" && sel.target === d.name;
      return `<li><span class="who"><b>${esc(d.name)}</b><span class="muted">${bars(d.rssi)}${d.rssi ?? "?"} dBm</span></span>
        <button class="small use" data-t="ble" data-v="${esc(d.name)}" ${isSel ? "disabled" : ""}>${isSel ? "Chosen" : "Use"}</button></li>`;
    }).join("")}</ul><div class="note-line">Scanned ${ago(scan.at)}.</div>`;
  $("ble").innerHTML = b;

  const ports = R.ports || [];
  $("usb").innerHTML = ports.length
    ? `<ul class="list">${ports.map((p) => {
        const isSel = sel && sel.transport === "usb" && sel.target === p;
        return `<li><span class="who"><b>${esc(p.replace("/dev/", ""))}</b></span>
          <button class="small use" data-t="usb" data-v="${esc(p)}" ${isSel ? "disabled" : ""}>${isSel ? "Chosen" : "Use"}</button></li>`;
      }).join("")}</ul>`
    : `<div class="empty-box">No robot cable found. Plug it in and press Refresh.</div>`;
  document.querySelectorAll("button.use").forEach((btn) => {
    btn.onclick = async () => {
      const r = await post("select", { transport: btn.dataset.t, target: btn.dataset.v, name: btn.dataset.v });
      if (r.ok) post("check");
    };
  });
}

// ---- demo deck ------------------------------------------------------------------------
function demoById(id) { return S.demos.find((d) => d.id === id); }

function renderDeck() {
  const run = S.run && S.run.active ? S.run : null;
  $("deck").innerHTML = S.demos.map((d) => {
    if (!d.ok) {
      return `<div class="demo broken"><span class="tags"><span class="t">cannot load</span></span><h3>${esc(d.title)}</h3><div class="err">${esc(d.error)}</div>
        <div class="muted small mono">${esc(d.source)}</div></div>`;
    }
    const tags = [
      run && run.demo_id === d.id ? `<span class="t live">running</span>` : "",
      d.supports_mock ? `<span class="t sim">simulator</span>` : "",
      d.moves_robot ? `<span class="t moves">moves the robot</span>` : `<span class="t still">does not move</span>`,
    ].join("");
    const needs = d.needs.length ? `<div class="needs"><b>Needs</b> ${d.needs.map(esc).join(" · ")}</div>` : "";
    const sel = d.id === selected;
    return `<button class="demo ${sel ? "selected" : ""}" data-id="${esc(d.id)}" aria-pressed="${sel}">
      <span class="tags">${tags}</span><h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p>${needs}
      <span class="pick" aria-hidden="true">${sel ? "▼ Shown below" : "○ Show this demo"}</span></button>`;
  }).join("") || `<div class="empty-box">No demos found. Run uv sync in the flybrain folder, then Reload list.</div>`;
  document.querySelectorAll(".demo[data-id]").forEach((el) => {
    el.onclick = () => { selected = el.dataset.id; lastError = null; renderDeck(); renderSetup(); };
  });
}

function fieldHtml(o, value) {
  const id = "opt-" + o.name;
  const help = o.help ? `<div class="help">${esc(o.help)}</div>` : "";
  if (o.type === "bool") {
    return `<div class="field check"><label><input type="checkbox" id="${id}" data-opt="${esc(o.name)}" ${value ? "checked" : ""}> ${esc(o.label)}</label>${help}</div>`;
  }
  if (o.type === "choice") {
    return `<div class="field"><label for="${id}">${esc(o.label)}</label><select id="${id}" data-opt="${esc(o.name)}">
      ${o.choices.map((c) => `<option ${String(c) === String(value) ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>${help}</div>`;
  }
  const num = o.type === "int" || o.type === "float";
  const attrs = num ? `type="number" step="${o.type === "int" ? 1 : "any"}" ${o.min != null ? `min="${o.min}"` : ""} ${o.max != null ? `max="${o.max}"` : ""}` : `type="text"`;
  return `<div class="field"><label for="${id}">${esc(o.label)}</label><input ${attrs} id="${id}" data-opt="${esc(o.name)}" value="${esc(value)}">${help}</div>`;
}

function formValues() {
  const v = {};
  document.querySelectorAll("[data-opt]").forEach((el) => {
    v[el.dataset.opt] = el.type === "checkbox" ? el.checked : el.value;
  });
  return v;
}

function renderSetup() {
  const d = selected && demoById(selected);
  if (!d || !d.ok) { $("setup").innerHTML = ""; formFor = null; return; }
  const keep = formFor === d.id ? formValues() : null;
  const vals = keep || { ...Object.fromEntries(d.options.map((o) => [o.name, o.default])), ...(d.saved || {}) };
  if (!d.supports_mock) simulator = false;
  const opts = d.options.filter((o) => simulator || !o.mock_only);
  const n = S.demos.indexOf(d) + 1;
  $("setup").innerHTML = `
    <div class="tray" role="region" aria-label="${esc(d.title)} settings">
      <div class="setup-head"><div><span class="label">${n} / ${S.demos.length}</span><h3>${esc(d.title)}</h3></div>
        ${d.has_guide ? `<a class="btn small" href="/demos/${encodeURIComponent(d.id)}/guide" target="_blank" rel="noopener">How it works →</a>` : ""}</div>
      ${opts.length ? `<div class="form">${opts.map((o) => fieldHtml(o, vals[o.name])).join("")}</div>` : `<div class="muted" style="margin-top:12px">No settings.</div>`}
      <div class="start-box">
        <div class="startbar">
          ${d.supports_mock ? `<label><input type="checkbox" id="sim" ${simulator ? "checked" : ""}> Try in simulator (no robot)</label>` : ""}
          <label class="space" id="space-wrap" hidden><input type="checkbox" id="space"> The robot has space to move</label>
          <button class="primary go" id="start">Start</button>
        </div>
        <div id="start-msg"></div>
        <div class="cmd" id="cmd"></div>
      </div>
    </div>`;
  formFor = d.id;
  const sim = $("sim");
  if (sim) sim.onchange = () => { simulator = sim.checked; lastError = null; renderSetup(); };
  document.querySelectorAll("[data-opt]").forEach((el) => { el.onchange = schedulePreview; el.oninput = schedulePreview; });
  $("start").onclick = start;
  updateStartState();
  schedulePreview();
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    if (!formFor) return;
    preview = await post("preview", { demo: formFor, options: formValues(), simulator });
    const wrap = $("space-wrap"); if (!wrap) return;
    wrap.hidden = !(preview.ok && preview.needs_space);
    $("cmd").textContent = preview.ok ? preview.command : "";
    if (!preview.ok) showStartMsg(preview.error, "bad");
  }, 120);
}

function showStartMsg(text, kind) {
  const m = $("start-msg"); if (!m) return;
  m.innerHTML = text ? `<div class="banner ${kind}">${esc(text)}</div>` : "";
}

function updateStartState() {
  const btn = $("start"); if (!btn) return;
  const run = S.run && S.run.active ? S.run : null;
  btn.disabled = !!run;
  btn.title = run ? "Stop the running demo first: one demo at a time" : "";
  if (lastError) showStartMsg(lastError, "bad");
  else if (run) showStartMsg(`${run.title} is running. Stop it before starting another demo.`, "info");
  else if (!simulator && !S.robot.selected) showStartMsg("No robot chosen yet: pick one on the left, or tick 'Try in simulator'.", "warn");
  else showStartMsg("", "");
}

async function start() {
  const space = $("space");
  const r = await post("start", { demo: formFor, options: formValues(), simulator, space: !!(space && space.checked) });
  if (space) space.checked = false; // every start asks again
  lastError = r.ok ? null : r.error;
  updateStartState();
  if (r.ok) window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---- running demo -------------------------------------------------------------------
const STATE_TEXT = {
  starting: "Starting", connecting: "Connecting", calibrating: "Calibrating", running: "Running",
  attention: "Needs attention", stopping: "Stopping", stopped: "Stopped", failed: "Failed",
};
function renderRun() {
  const r = S.run, panel = $("run-panel");
  $("layout").classList.toggle("has-run", !!(r && r.active));
  if (!r) { panel.hidden = true; frameUrl = null; return; }
  panel.hidden = false;
  panel.classList.toggle("live", !!r.active);
  const link = r.transport === "mock" ? "simulator" : (r.transport === "ble" ? "Bluetooth " : "USB ") + (r.robot || "");
  let head = `<div class="run-head"><div><span class="ls-eyebrow">${r.active ? "Now running" : "Last run"}</span>
      <h2>${esc(r.title)}</h2><div class="via">${esc(link)}</div></div>
      <div class="run-actions"><span class="pill ${esc(r.state)}">${esc(STATE_TEXT[r.state] || r.state)}</span>
      ${r.active ? `<button class="danger" id="stop" ${r.state === "stopping" ? "disabled" : ""}>${r.state === "stopping" ? "Stopping…" : "Stop"}</button>` : ""}</div></div>`;
  if (r.detail) head += `<div class="detail">${esc(r.detail)}</div>`;
  for (const w of r.warnings || []) head += `<div class="banner warn">${esc(w)}</div>`;
  if (!r.active && r.reason) head += `<div class="banner ${r.state === "failed" ? "bad" : "ok"}">${esc(r.reason)}</div>`;
  // keep the iframe element alive across updates so the dashboard does not reload
  const showFrame = r.active && r.url;
  if (!panel.querySelector("#run-top")) {
    panel.innerHTML = `<div id="run-top"></div><div id="frame-slot"></div>
      <details class="log" id="logbox"><summary>Output</summary><pre class="log" id="log"></pre></details>`;
  }
  $("run-top").innerHTML = head;
  const st = $("stop"); if (st) st.onclick = () => post("stop");
  if (showFrame && frameUrl !== r.url) {
    frameUrl = r.url;
    $("frame-slot").innerHTML = `<div class="frame-wrap" id="frame-wrap"><div class="frame-bar"><span class="label">Dashboard</span>
      <a href="${esc(r.url)}" target="_blank" rel="noopener">${APP ? "Open in its own window ↗" : "Open in a new tab ↗"}</a></div>
      <iframe title="${esc(r.title)} dashboard" src="${esc(r.url)}"></iframe></div>`;
  } else if (!showFrame) {
    frameUrl = null;
    $("frame-slot").innerHTML = r.active
      ? `<div class="empty-box waiting">The dashboard appears here when the demo is ready.</div>`
      : "";
  }
  const log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = (r.log || []).join("\n");
  if (stick) log.scrollTop = log.scrollHeight;
  if (!r.active && r.state === "failed") $("logbox").open = true;
}

function render() {
  if (!S) return;
  renderBanners();
  renderRobot();
  renderDeck();
  if (formFor !== selected) renderSetup();
  updateStartState();
  renderRun();
}

// ---- wiring -----------------------------------------------------------------------
$("scan").onclick = () => post("scan");
$("ports").onclick = () => post("ports");
$("reload").onclick = async () => { const r = await post("reload"); if (!r.ok) alert(r.error); };
$("quit").onclick = async () => {
  const running = S && S.run && S.run.active;
  if (running && !confirm("Stop " + S.run.title + " (the robot rests) and quit Flydeck?")) return;
  if (APP) APP.quit(); else post("quit");
};

// ---- inside the Flydeck window (pywebview) ---------------------------------------------
// Links: web pages open in the default browser; guides and dashboards in another Flydeck
// window. Where the demos come from: the built-in ones, or a flybrain folder of yours.
let APP = null, SOURCE = null, sourceMsg = null;
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a || !APP) return;
  const u = new URL(a.getAttribute("href"), location.href);
  if (u.protocol !== "http:" && u.protocol !== "https:") return;
  const local = u.hostname === "127.0.0.1" || u.hostname === "localhost";
  if (!local) { e.preventDefault(); APP.open_external(u.href); }
  else if (a.target === "_blank") { e.preventDefault(); APP.open_window(u.href, a.textContent.replace(/[→↗]/g, "").trim()); }
}, true);

function renderSource() {
  const box = $("source");
  if (!SOURCE || !SOURCE.switchable) { box.hidden = true; return; }
  box.hidden = false;
  const mine = SOURCE.kind === "folder";
  let h = `<div class="source"><span class="label">Demos from</span>
    <span class="what">${mine ? `<span class="path" title="${esc(SOURCE.root)}">${esc(SOURCE.root)}</span>` : `built into Flydeck`}</span>
    <button class="small" id="pick">${mine ? "Change folder…" : "Use my flybrain folder…"}</button>
    ${mine ? `<button class="small" id="builtin">Use the built-in demos</button>` : ""}</div>`;
  const msg = sourceMsg || SOURCE.note;
  if (msg) h += `<div class="banner warn">${esc(msg)}</div>`;
  box.innerHTML = h;
  $("pick").onclick = async () => {
    const r = await APP.choose_folder();
    sourceMsg = r.ok || r.cancelled ? null : r.error;
    renderSource();
  };
  const b = $("builtin");
  if (b) b.onclick = async () => { const r = await APP.use_builtin(); sourceMsg = r.ok || r.cancelled ? null : r.error; renderSource(); };
}

window.addEventListener("pywebviewready", async () => {
  APP = window.pywebview.api;
  $("gone-hint").textContent = "Flydeck is closing.";
  try { SOURCE = await APP.source(); } catch (e) { SOURCE = null; }
  renderSource();
  frameUrl = null; // redraw the dashboard link for the window
  if (S) renderRun();
});

function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    if (selected === null && S.demos.length) {
      const run = S.run && S.run.active ? S.run.demo_id : null;
      selected = run || (S.demos.find((d) => d.ok) || {}).id || null;
    }
    render();
  };
  es.addEventListener("bye", () => { es.close(); $("gone").classList.add("show"); });
}
connect();
</script>
