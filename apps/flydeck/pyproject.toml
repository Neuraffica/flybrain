[project]
name = "flydeck"
version = "0.1.0"
description = "Flydeck: pick a robot, pick a fly-brain demo, press Start"
requires-python = ">=3.11"
dependencies = [
    "flybrain-demo-api",
    "flybrain-edge",
    "numpy",
    # the Flydeck window (WKWebView); elsewhere Flydeck opens in the web browser
    "pywebview>=6.2; sys_platform == 'darwin'",
]

[project.scripts]
flydeck = "flydeck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flydeck"]

[tool.uv.sources]
flybrain-demo-api = { workspace = true }
flybrain-edge = { workspace = true }
